<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Error</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .error-box {
            width: 90%;
            max-width: 650px;
            text-align: center;
            padding: 45px 30px;
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border: 5px solid #ff3b30;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            font-weight: bold;
            color: #ff3b30;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .message {
            color: #bdbdbd;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .error-code {
            display: inline-block;
            background: #171717;
            border: 1px solid #333;
            padding: 12px 18px;
            border-radius: 7px;
            color: #ff5c5c;
            font-family: monospace;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #ff3b30;
            animation: loading 5s infinite;
        }

        .status {
            font-size: 13px;
            color: #777;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #eeeeee;
        }

        .footer {
            margin-top: 35px;
            color: #555;
            font-size: 12px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.7;
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            70% {
                width: 85%;
            }

            100% {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="error-box">

        <div class="icon">!</div>

        <h1>Something went wrong</h1>

        <p class="message">
            We couldn't load this website right now.
            Please try again later.
        </p>

        <div class="error-code">
            ERROR_CODE: 0xU5E1E55
        </div>

        <div class="progress-container">
            <div class="progress"></div>
        </div>

        <div class="status" id="status">
            Checking connection...
        </div>

        <button onclick="tryAgain()">
            Try Again
        </button>

        <div class="footer">
            Error ID: #928374 • System Status: Unknown
        </div>

    </div>

    <script>

        const statusText = document.getElementById("status");

        const messages = [
            "Checking connection...",
            "Contacting server...",
            "Server is thinking...",
            "Still trying...",
            "Almost working...",
            "Nope. Something went wrong."
        ];

        let index = 0;

        setInterval(() => {

            if (index < messages.length) {
                statusText.textContent = messages[index];
                index++;
            }

        }, 1000);


        function tryAgain() {

            statusText.textContent = "Trying again...";

            setTimeout(() => {

                statusText.textContent =
                    "Error: The website still doesn't want to work 😂";

            }, 1500);

        }

    </script>

</body>
</html>
